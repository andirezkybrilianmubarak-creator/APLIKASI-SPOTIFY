name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Project Root & Build APK
        run: |
          # Cari lokasi file pubspec.yaml (ada di ./aghani_app)
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: File pubspec.yaml tidak ditemukan di repository!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Project ditemukan di direktori: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Bebaskan versi file_picker agar memakai versi yang kompatibel dengan SDK 36
          sed -i 's/file_picker:.*/file_picker: any/g' pubspec.yaml
          
          # Generate scaffold Android secara non-destructive
          flutter create --platforms=android --org com.aghani --project-name aghani_app /tmp/scaffold
          mkdir -p android
          cp -rn /tmp/scaffold/android/. android/
          
          # Patch minSdk ke 23 & compileSdk ke 36 pada app build.gradle
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/minSdk = 21/minSdk = 23/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = 34/compileSdk = 36/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' android/app/build.gradle
          fi

          # Paksa seluruh subproject memakai compileSdk 36 di tahap gradle.projectsEvaluated
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts

          gradle.projectsEvaluated {
              subprojects {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                      compileSdkVersion(36)
                  }
              }
          }
          EOF
          elif [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle

          gradle.projectsEvaluated {
              subprojects {
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          fi
          
          # Download package dan build APK
          flutter pub get
          flutter build apk --release
          
          # Pindahkan APK ke root workspace agar siap di-upload artifact
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output_apk/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: output_apk/app-release.apk
          if-no-files-found: error
