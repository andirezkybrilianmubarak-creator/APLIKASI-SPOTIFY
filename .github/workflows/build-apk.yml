name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Membuat scaffold Android terbaru dari Flutter, TANPA menimpa file milik kita
      # (AndroidManifest.xml berisi izin audio/internet tetap dipakai).
      - name: Generate Android scaffold (non-destructive)
        run: |
          flutter create --platforms=android --org com.aghani --project-name aghani_app /tmp/scaffold
          mkdir -p android
          cp -rn /tmp/scaffold/android/. android/

      - name: Patch Gradle (minSdk 23)
        run: python3 tool/patch_gradle.py

      - name: Flutter pub get
        run: flutter pub get

      # Tanpa keystore: template Flutter menandatangani release dengan debug key,
      # sehingga APK tetap bisa langsung di-install.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
